title: High request rate from one client (possible scanner)
id: a0c7610a-4fa0-5b60-88c4-91073ef7d72a
status: experimental
description: One client sent a very high number of requests in a minute. Works even when a scanner hides its user agent.
author: ai-vuln-scanner
date: 2026-11-20
tags:
    - attack.reconnaissance
    - attack.t1595.002
correlation:
    type: event_count
    rules:
        - all_web_requests
    group-by:
        - c-ip
    timespan: 1m
    condition:
        gte: 300
falsepositives:
    - Load tests, busy search engine crawlers
level: high
