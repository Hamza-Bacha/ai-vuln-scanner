title: Known scanner user agent seen
id: 9cad6d35-e320-50ec-ba55-6c62c0918aa0
status: experimental
description: "Requests from scanners that announce themselves (this tool, sqlmap, Nikto, Nmap, gobuster, wfuzz). Nuclei rotates browser user agents, so it is NOT caught here."
author: ai-vuln-scanner
date: 2026-11-20
tags:
    - attack.reconnaissance
    - attack.t1595.002
logsource:
    category: webserver
detection:
    selection:
        cs-user-agent|contains:
            - 'ai-vuln-scanner'
            - 'sqlmap'
            - 'nikto'
            - 'nmap scripting engine'
            - 'gobuster'
            - 'wfuzz'
    condition: selection
falsepositives:
    - Legitimate use of this path by administrators
level: medium
